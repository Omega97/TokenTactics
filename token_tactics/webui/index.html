<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TokenTactics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar">
    <h1>TokenTactics</h1>
    <div id="topbar-right">
      <div id="status" class="status compiled" title="compiled">
        <span class="dot"></span>
        <span id="status-label">compiled</span>
      </div>
    </div>
  </header>

  <div id="error-banner" class="hidden"></div>

  <main>
    <section id="board-panel">
      <div id="players-box" class="box">
        <div class="box-title">Players</div>
        <div id="players"></div>
      </div>
      <div id="right-col">
        <div id="board-box" class="box">
          <div class="box-title">Board<span id="board-turn"></span></div>
          <div id="board">Loading…</div>
        </div>
        <div id="priority-box" class="box">
          <div class="box-title">Priority &amp; Votes</div>
          <div id="priority"></div>
        </div>
      </div>
    </section>
    <section id="editor-panel">
      <div id="editor"></div>
    </section>
  </main>

  <div id="settings-panel" class="hidden">
    <h2>Settings</h2>
    <label class="setting">
      <span>Coordinates</span>
      <select id="setting-coordinates">
        <option value="numbers">Numbers (keycap)</option>
        <option value="dots">No coordinates (dots)</option>
      </select>
    </label>
    <label class="setting">
      <span>Command color</span>
      <input type="color" id="setting-command-color" value="#89b4fa" />
    </label>
    <label class="setting">
      <span>Comment color</span>
      <input type="color" id="setting-comment-color" value="#808080" />
    </label>
    <label class="setting">
      <span>Board background</span>
      <input type="color" id="setting-board-bg" value="#141414" />
    </label>
    <label class="setting">
      <span>Board size</span>
      <span class="range-wrap">
        <input type="range" id="setting-board-zoom" min="0.5" max="2.5" step="0.1" value="1" />
        <span id="setting-board-zoom-value" class="range-value">1.0×</span>
      </span>
    </label>
    <label class="setting">
      <span>Accent color</span>
      <input type="color" id="setting-accent" value="#ff2d95" />
    </label>
    <label class="setting">
      <span>Secondary color</span>
      <input type="color" id="setting-accent-2" value="#00e5ff" />
    </label>
  </div>

  <button id="settings-gear" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 5a7.6 7.6 0 0 0-.1-1l2.06-1.6a.5.5 0 0 0 .12-.64l-1.95-3.38a.5.5 0 0 0-.61-.22l-2.43.98a7.3 7.3 0 0 0-1.73-1l-.37-2.58A.5.5 0 0 0 15.44 3h-3.9a.5.5 0 0 0-.5.42l-.37 2.58c-.62.25-1.2.59-1.73 1l-2.43-.98a.5.5 0 0 0-.61.22L4.03 9.62a.5.5 0 0 0 .12.64l2.06 1.6a7.6 7.6 0 0 0-.1 1c0 .34.04.67.1 1l-2.06 1.6a.5.5 0 0 0-.12.64l1.95 3.38a.5.5 0 0 0 .61.22l2.43-.98c.53.41 1.11.75 1.73 1l.37 2.58a.5.5 0 0 0 .5.42h3.9a.5.5 0 0 0 .5-.42l.37-2.58a7.3 7.3 0 0 0 1.73-1l2.43.98a.5.5 0 0 0 .61-.22l1.95-3.38a.5.5 0 0 0-.12-.64l-2.06-1.6a7.6 7.6 0 0 0 .1-1z"/>
    </svg>
  </button>

  <button id="emoji-btn" title="Emoji" aria-label="Emoji">😀</button>

  <div id="emoji-panel" class="hidden">
    <div id="emoji-grid"></div>
  </div>

  <div id="toast">Copied to clipboard!</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
