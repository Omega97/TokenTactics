<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TokenTactics</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar">
    <h1>TokenTactics</h1>
    <div id="status" class="status compiled" title="compiled">
      <span class="dot"></span>
      <span id="status-label">compiled</span>
    </div>
  </header>

  <div id="error-banner" class="hidden"></div>

  <main>
    <section id="board-panel">
      <pre id="board">Loading…</pre>
    </section>
    <section id="editor-panel">
      <div id="editor"></div>
    </section>
  </main>

  <div id="settings-panel" class="hidden">
    <h2>Settings</h2>
    <label class="setting">
      <span>Coordinates</span>
      <select id="setting-coordinates">
        <option value="dots">No coordinates (dots)</option>
        <option value="numbers">Numbers (keycap)</option>
      </select>
    </label>
    <label class="setting">
      <span>Command color</span>
      <input type="color" id="setting-command-color" value="#89b4fa" />
    </label>
    <label class="setting">
      <span>Comment color</span>
      <input type="color" id="setting-comment-color" value="#808080" />
    </label>
    <label class="setting">
      <span>Board background</span>
      <input type="color" id="setting-board-bg" value="#141414" />
    </label>
  </div>

  <button id="settings-gear" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 5a7.6 7.6 0 0 0-.1-1l2.06-1.6a.5.5 0 0 0 .12-.64l-1.95-3.38a.5.5 0 0 0-.61-.22l-2.43.98a7.3 7.3 0 0 0-1.73-1l-.37-2.58A.5.5 0 0 0 15.44 3h-3.9a.5.5 0 0 0-.5.42l-.37 2.58c-.62.25-1.2.59-1.73 1l-2.43-.98a.5.5 0 0 0-.61.22L4.03 9.62a.5.5 0 0 0 .12.64l2.06 1.6a7.6 7.6 0 0 0-.1 1c0 .34.04.67.1 1l-2.06 1.6a.5.5 0 0 0-.12.64l1.95 3.38a.5.5 0 0 0 .61.22l2.43-.98c.53.41 1.11.75 1.73 1l.37 2.58a.5.5 0 0 0 .5.42h3.9a.5.5 0 0 0 .5-.42l.37-2.58a7.3 7.3 0 0 0 1.73-1l2.43.98a.5.5 0 0 0 .61-.22l1.95-3.38a.5.5 0 0 0-.12-.64l-2.06-1.6a7.6 7.6 0 0 0 .1-1z"/>
    </svg>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
